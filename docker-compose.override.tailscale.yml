# Tailnet-only ingress for local-ai-packaged via DockTail.
# Standard: 55_TAILSCALE PRD v2 (DockTail). Apply this INSTEAD of
# docker-compose.override.private.yml (which would publish host ports). It adds ONE
# tag:server Tailscale sidecar + the DockTail daemon, and labels UI services as
# private Tailscale Services. NO host ports — Serve/HTTPS on :443 is the only ingress.
#
# Bring up (Open WebUI first — P1-1):
#   op run --env-file=.env.tailscale.tpl -- \
#     docker compose -p localai -f docker-compose.yml -f docker-compose.override.tailscale.yml \
#     up -d open-webui tailscale docktail
#
# HOW TO ADD A SERVICE: give its block 4 labels (enable / name / port=<container-port> /
# service-port=443). Never edit service-port on a live Service — delete it or rename first.

services:
  # One Tailscale NODE (sidecar, tag:server) that advertises the Services.
  # macOS/Docker Desktop -> sidecar mode, kernel networking (/dev/net/tun + NET_ADMIN).
  tailscale:
    image: tailscale/tailscale:v1.98.4        # pin; matches the validated spike
    container_name: ts-localai
    hostname: localai-docktail                # -> localai-docktail.tail0d6f8e.ts.net
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY via op run (OAuth client secret, tag server)}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_USERSPACE=false
    volumes:
      - ts-state:/var/lib/tailscale
      - ts-sock:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, SYS_MODULE]
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The DockTail daemon: watches Docker labels, advertises/updates Tailscale Services,
  # proxies each to the container's IP on localai_default (direct mode, no host ports).
  docktail:
    image: ghcr.io/marvinvr/docktail:latest   # TODO: pin by digest after reviewing the fork
    container_name: docktail
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ts-sock:/var/run/tailscale
    environment:
      - LOG_LEVEL=info
      - RECONCILE_INTERVAL=15s
      - DEFAULT_SERVICE_TAGS=tag:container
      - TAILSCALE_OAUTH_CLIENT_ID=${TAILSCALE_OAUTH_CLIENT_ID:?set via op run}
      - TAILSCALE_OAUTH_CLIENT_SECRET=${TAILSCALE_OAUTH_CLIENT_SECRET:?set via op run}
    restart: unless-stopped

  # --- P1-1: Open WebUI as a private Tailscale Service (labels merged onto the base service) ---
  open-webui:
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=openwebui"       # -> https://openwebui.tail0d6f8e.ts.net
      - "docktail.service.port=8080"            # open-webui listens on 8080 inside the container
      - "docktail.service.service-port=443"     # HTTPS terminated with the ts.net cert

  # --- P1-2: Flowise as a private Tailscale Service ---
  flowise:
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=flowise"         # -> https://flowise.tail0d6f8e.ts.net
      - "docktail.service.port=3001"            # flowise listens on 3001 inside the container (PORT=3001)
      - "docktail.service.service-port=443"     # HTTPS terminated with the ts.net cert

  # --- P1-3: Langfuse as a private Tailscale Service ---
  langfuse-web:
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=langfuse"        # -> https://langfuse.tail0d6f8e.ts.net
      - "docktail.service.port=3000"            # langfuse-web listens on 3000 inside the container
      - "docktail.service.service-port=443"     # HTTPS terminated with the ts.net cert
    environment:
      # base compose hardcodes http://localhost:3002 — point NextAuth at the tailnet origin
      - NEXTAUTH_URL=https://langfuse.tail0d6f8e.ts.net

  # --- P1-6: Neo4j browser as a private Tailscale Service ---
  # NOTE: the Neo4j Browser (served on 7474) connects to bolt (7687) SEPARATELY. Over the
  # tailnet only 7474 is a Service, so login to the graph may fail until bolt is also
  # reachable (future: a TCP/TLS Service for 7687, or NEO4J advertised address). The UI
  # itself loads/serves over HTTPS — that's what the seam checks here.
  neo4j:
    labels:
      # primary: the Neo4j Browser HTTP UI
      - "docktail.service.enable=true"
      - "docktail.service.name=neo4j"           # -> https://neo4j.tail0d6f8e.ts.net
      - "docktail.service.port=7474"            # Neo4j Browser HTTP UI
      - "docktail.service.service-port=443"
      # indexed service #1: bolt (7687) as a plain TCP Tailscale Service (WireGuard-
      # encrypted). Reachable at neo4j-bolt.tail0d6f8e.ts.net:7687 for bolt DRIVERS /
      # cypher-shell / Neo4j Desktop  ->  bolt://neo4j-bolt.tail0d6f8e.ts.net:7687
      # CAVEAT: the HTTPS-served Neo4j Browser (neo4j.tail0d6f8e.ts.net) can NOT use a
      # plain-bolt URL from the page (mixed-content). That needs tls-terminated-tcp
      # (neo4j+s://), which did not apply on tailscaled v1.98.4 ("No serve config" /
      # invalid cert domain) — revisit when the sidecar image is bumped.
      - "docktail.service.1.name=neo4j-bolt"    # -> neo4j-bolt.tail0d6f8e.ts.net:7687
      - "docktail.service.1.port=7687"
      - "docktail.service.1.protocol=tcp"                     # backend: plain bolt TCP
      - "docktail.service.1.service-protocol=tcp"             # tailnet edge: plain TCP (WireGuard-encrypted)
      - "docktail.service.1.service-port=7687"

  # --- P1-5: Supabase API/Studio (Kong gateway) as a private Tailscale Service ---
  # Kong is pulled in via the base compose's `include:` of supabase/docker/docker-compose.yml.
  # Strip its published host ports and expose it only through the tailnet.
  kong:
    ports: !reset null
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=supabase"        # -> https://supabase.tail0d6f8e.ts.net
      - "docktail.service.port=8000"            # Kong HTTP gateway (Studio + REST/auth)
      - "docktail.service.service-port=443"

  # Supavisor (Postgres pooler) publishes host ports too — strip them (internal only, no Service).
  supavisor:
    ports: !reset null

  # --- P1-4: n8n (in-stack) as a private Tailscale Service ---
  # Needs Supabase's `db` (DB_POSTGRESDB_HOST=db) + n8n-import to complete first.
  # WEBHOOK_URL auto-derives from N8N_HOSTNAME in .env; set the editor/host origin here too.
  n8n:
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=n8n"             # -> https://n8n.tail0d6f8e.ts.net
      - "docktail.service.port=5678"
      - "docktail.service.service-port=443"
    environment:
      - N8N_HOST=n8n.tail0d6f8e.ts.net
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://n8n.tail0d6f8e.ts.net

volumes:
  ts-state:
  ts-sock:
